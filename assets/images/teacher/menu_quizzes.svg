<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#2d1c03" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="220" rx="16" fill="url(#bgGrad3)" />

  <!-- Dotted Pattern -->
  <circle cx="50" cy="80" r="1.5" fill="#f59e0b" opacity="0.3" />
  <circle cx="80" cy="110" r="1.5" fill="#f59e0b" opacity="0.3" />
  <circle cx="340" cy="50" r="1.5" fill="#f59e0b" opacity="0.3" />
  <circle cx="360" cy="120" r="1.5" fill="#f59e0b" opacity="0.3" />

  <!-- Exam Clipboard -->
  <g transform="translate(60, 48)">
    <!-- Board Base -->
    <rect width="130" height="150" rx="12" fill="url(#clipGrad)" stroke="#475569" stroke-width="2" />
    <!-- Paper Sheet -->
    <rect x="10" y="16" width="110" height="124" rx="6" fill="#f8fafc" />
    <!-- Paper Clip Header -->
    <rect x="42" y="-4" width="46" height="14" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <circle cx="65" cy="3" r="3" fill="#1e293b" />

    <!-- Quiz Question Lines & Checkmarks -->
    <circle cx="24" cy="36" r="6" fill="#10b981" />
    <path d="M 21 36 L 23 38 L 27 34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="36" y="33" width="70" height="6" rx="3" fill="#94a3b8" />

    <circle cx="24" cy="56" r="6" fill="#10b981" />
    <path d="M 21 56 L 23 58 L 27 54" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <rect x="36" y="53" width="60" height="6" rx="3" fill="#94a3b8" />

    <circle cx="24" cy="76" r="6" fill="#f59e0b" />
    <circle cx="24" cy="76" r="2.5" fill="#ffffff" />
    <rect x="36" y="73" width="65" height="6" rx="3" fill="#cbd5e1" />

    <circle cx="24" cy="96" r="6" fill="#cbd5e1" />
    <rect x="36" y="93" width="55" height="6" rx="3" fill="#e2e8f0" />

    <circle cx="24" cy="116" r="6" fill="#cbd5e1" />
    <rect x="36" y="113" width="62" height="6" rx="3" fill="#e2e8f0" />
  </g>

  <!-- Right Floating Cards: Timer & Token Key -->
  <!-- Token Key Card -->
  <g transform="translate(225, 52)">
    <rect width="145" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow3)" />
    <circle cx="24" cy="24" r="12" fill="#f59e0b" fill-opacity="0.2" />
    <path d="M 21 21 C 21 19 23 17 25 17 C 27 17 29 19 29 21 C 29 22.5 28 23.5 26.5 24.5 L 26.5 29 L 24 29 L 24 26 L 21.5 26 L 21.5 24.5 C 21 24 21 22 21 21 Z" fill="#fbbf24" />
    <text x="44" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" font-weight="700">TOKEN UJIAN</text>
    <text x="44" y="37" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="800" letter-spacing="1">NET-2026</text>
  </g>

  <!-- Timer Card -->
  <g transform="translate(225, 120)">
    <rect width="145" height="48" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="24" cy="24" r="12" fill="#fbbf24" fill-opacity="0.2" />
    <circle cx="24" cy="24" r="8" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 24 19 V 24 L 27 26" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" font-weight="700">TIMER UJIAN</text>
    <text x="44" y="37" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">15 MENIT</text>
  </g>

  <!-- Left Top Badge -->
  <g transform="translate(30, 24)">
    <rect width="120" height="26" rx="6" fill="#b45309" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#fbbf24" />
    <text x="22" y="17" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700">BANK SOAL AKTIF</text>
  </g>
</svg>