<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>

  <rect width="880" height="490" rx="14" fill="url(#bgGrad5)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 05</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Perangkat Keras Jaringan &amp; Standar Crimping UTP T568B</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Perbandingan Hub, Switch, Router (Collision vs Broadcast Domain) dan Urutan 8 Pin RJ-45.</text>
  </g>

  <!-- Left: Device Comparison (Hub vs Switch vs Router) -->
  <g transform="translate(30, 80)">
    <rect width="440" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">PERBANDINGAN KONSENTRATOR JARINGAN</text>

    <!-- 1. HUB -->
    <g transform="translate(20, 40)">
      <rect width="400" height="96" rx="6" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="24" rx="4" fill="#b91c1c"/>
      <text x="47" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">HUB</text>
      <text x="92" y="26" fill="#f87171" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Layer 1 (Physical) - Blind Repeater</text>
      <text x="12" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• <tspan fill="#f87171" font-weight="700">1 Shared Collision Domain:</tspan> Jika 2 PC kirim data bersamaan → Terjadi tabrakan data (Collision)!</text>
      <text x="12" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• <tspan fill="#f87171" font-weight="700">1 Shared Broadcast Domain:</tspan> Semua bit dikopi ke seluruh port.</text>
      <text x="12" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Status: Usang (Obsolete), digantikan Switch sepenuhnya.</text>
    </g>

    <!-- 2. SWITCH -->
    <g transform="translate(20, 146)">
      <rect width="400" height="96" rx="6" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="24" rx="4" fill="#0369a1"/>
      <text x="47" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">SWITCH</text>
      <text x="92" y="26" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Layer 2 (Data Link) - Cerdas via MAC Table</text>
      <text x="12" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• <tspan fill="#38bdf8" font-weight="700">Dedicated Collision Domain per Port:</tspan> Bebas tabrakan antar port!</text>
      <text x="12" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• <tspan fill="#f59e0b" font-weight="700">1 Shared Broadcast Domain:</tspan> Masih meneruskan broadcast (ARP) ke semua port.</text>
      <text x="12" y="84" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Fitur Utama: Port switching berkecepatan kawat (Gigabit Ethernet).</text>
    </g>

    <!-- 3. ROUTER -->
    <g transform="translate(20, 252)">
      <rect width="400" height="110" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="24" rx="4" fill="#047857"/>
      <text x="47" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">ROUTER</text>
      <text x="92" y="26" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Layer 3 (Network) - Inter-Subnet Gateway</text>
      <text x="12" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• <tspan fill="#34d399" font-weight="700">Memecah Collision &amp; Broadcast Domain:</tspan> Setiap antarmuka router membentuk broadcast domain terpisah.</text>
      <text x="12" y="68" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">• Menentukan rute terbaik (Best Path) menggunakan tabel routing (OSPF, RIP, BGP).</text>
      <text x="12" y="86" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Fungsi Kunci: Menghubungkan jaringan lokal LAN ke Internet WAN.</text>
    </g>
  </g>

  <!-- Right: T568B Pinout Diagram -->
  <g transform="translate(490, 80)">
    <rect width="360" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="24" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">SUSUNAN 8 PIN KABEL UTP (T568B)</text>
    <text x="20" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Standar Industri Paling Banyak Digunakan untuk RJ-45</text>

    <!-- 8 Wire Strips Diagram -->
    <g transform="translate(20, 52)">
      <!-- RJ-45 Plug Outline -->
      <rect x="0" y="0" width="320" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="160" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">KONEKTOR RJ-45 (Dilihat dari klip pengunci bawah)</text>

      <!-- 8 Pins representation -->
      <!-- Pin 1: Putih Oranye -->
      <g transform="translate(15, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#ea580c" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">1</text>
        <text x="15" y="140" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">W-Or</text>
      </g>
      <!-- Pin 2: Oranye -->
      <g transform="translate(52, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#ea580c"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">2</text>
        <text x="15" y="140" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Or</text>
      </g>
      <!-- Pin 3: Putih Hijau -->
      <g transform="translate(89, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#16a34a" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">3</text>
        <text x="15" y="140" fill="#bbf7d0" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">W-Gr</text>
      </g>
      <!-- Pin 4: Biru -->
      <g transform="translate(126, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#2563eb"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">4</text>
        <text x="15" y="140" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Blue</text>
      </g>
      <!-- Pin 5: Putih Biru -->
      <g transform="translate(163, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">5</text>
        <text x="15" y="140" fill="#bfdbfe" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">W-Bl</text>
      </g>
      <!-- Pin 6: Hijau -->
      <g transform="translate(200, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#16a34a"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">6</text>
        <text x="15" y="140" fill="#bbf7d0" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Gr</text>
      </g>
      <!-- Pin 7: Putih Cokelat -->
      <g transform="translate(237, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#78350f" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">7</text>
        <text x="15" y="140" fill="#fde68a" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">W-Br</text>
      </g>
      <!-- Pin 8: Cokelat -->
      <g transform="translate(274, 35)">
        <rect x="0" y="0" width="30" height="110" rx="3" fill="#78350f"/>
        <text x="15" y="125" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">8</text>
        <text x="15" y="140" fill="#fde68a" font-family="'Inter', sans-serif" font-size="7" text-anchor="middle">Brown</text>
      </g>
    </g>

    <!-- Cable Type Usage Summary -->
    <g transform="translate(20, 266)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="320" height="46" rx="4" fill="#1e293b"/>
      <text x="10" y="18" fill="#38bdf8" font-weight="700">Straight-Through (T568B - T568B):</text>
      <text x="10" y="32" fill="#94a3b8">Untuk perangkat berbeda jenis: PC ke Switch, Switch ke Router.</text>
    </g>
    <g transform="translate(20, 318)" font-family="'Inter', sans-serif" font-size="10">
      <rect width="320" height="46" rx="4" fill="#1e293b"/>
      <text x="10" y="18" fill="#f59e0b" font-weight="700">Crossover (T568A - T568B):</text>
      <text x="10" y="32" fill="#94a3b8">Untuk perangkat sejenis: PC ke PC, Switch ke Switch tanpa Auto-MDIX.</text>
    </g>
  </g>
</svg>

