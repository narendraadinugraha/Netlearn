<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>

  <rect width="880" height="490" rx="14" fill="url(#bgGrad6)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 06</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Layanan Jaringan: Alur DHCP D-O-R-A &amp; Hierarki Resolusi DNS</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Mekanisme Otomasi IP Address Klien dan Pemetaan Nama Domain ke Alamat IP.</text>
  </g>

  <!-- Left: DHCP D-O-R-A Sequence -->
  <g transform="translate(30, 80)">
    <rect width="405" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1. SIKLUS 4 TAHAP DHCP (D-O-R-A)</text>
    <text x="20" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Pemberian Alamat IP Otomatis dari Server ke Klien</text>

    <!-- Client and Server Columns -->
    <!-- Client Head -->
    <rect x="35" y="55" width="80" height="30" rx="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="74" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">KLIEN PC</text>
    <!-- Server Head -->
    <rect x="290" y="55" width="80" height="30" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1"/>
    <text x="330" y="74" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">DHCP SRV</text>

    <!-- Timeline Vertical lines -->
    <line x1="75" y1="85" x2="75" y2="355" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5"/>
    <line x1="330" y1="85" x2="330" y2="355" stroke="#334155" stroke-dasharray="4,4" stroke-width="1.5"/>

    <!-- Step 1: DISCOVER -->
    <g transform="translate(75, 115)">
      <line x1="0" y1="0" x2="250" y2="25" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="250,25 240,20 242,28" fill="#38bdf8"/>
      <rect x="40" y="-8" width="170" height="20" rx="3" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="125" y="6" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">1. DISCOVER (Broadcast)</text>
    </g>

    <!-- Step 2: OFFER -->
    <g transform="translate(75, 175)">
      <line x1="255" y1="0" x2="5" y2="25" stroke="#10b981" stroke-width="2"/>
      <polygon points="5,25 15,20 13,28" fill="#10b981"/>
      <rect x="40" y="-8" width="170" height="20" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="125" y="6" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">2. OFFER (IP: 192.168.1.15)</text>
    </g>

    <!-- Step 3: REQUEST -->
    <g transform="translate(75, 235)">
      <line x1="0" y1="0" x2="250" y2="25" stroke="#f59e0b" stroke-width="2"/>
      <polygon points="250,25 240,20 242,28" fill="#f59e0b"/>
      <rect x="40" y="-8" width="170" height="20" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="125" y="6" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">3. REQUEST (Setujui IP)</text>
    </g>

    <!-- Step 4: ACKNOWLEDGE -->
    <g transform="translate(75, 295)">
      <line x1="255" y1="0" x2="5" y2="25" stroke="#a855f7" stroke-width="2"/>
      <polygon points="5,25 15,20 13,28" fill="#a855f7"/>
      <rect x="40" y="-8" width="170" height="20" rx="3" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="125" y="6" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">4. ACK (Terkonfirmasi)</text>
    </g>
  </g>

  <!-- Right: DNS Resolution Tree -->
  <g transform="translate(450, 80)">
    <rect width="400" height="380" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2. HIERARKI RESOLUSI DNS</text>
    <text x="20" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Translasi Nama Host Domain ke Alamat IP (Port UDP 53)</text>

    <!-- Hierarchy Tree Steps -->
    <!-- Tier 1: Client Browser -->
    <g transform="translate(20, 55)">
      <rect width="360" height="42" rx="5" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">1. Klien Mengetik: https://smkn1.sch.id</text>
      <text x="14" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Cek Cache Lokal → Jika tidak ada, kirim kueri ke Recursive DNS</text>
    </g>

    <!-- Down arrow -->
    <path d="M200,98 L200,108" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Tier 2: Root Server -->
    <g transform="translate(20, 110)">
      <rect width="360" height="48" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">2. Root Nameserver (Titik "." Akar)</text>
      <text x="14" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">13 Klaster Root Server Dunia (A s.d M) mengarahkan kueri ke:</text>
      <text x="14" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9">TLD Server untuk ekstensi ".id"</text>
    </g>

    <!-- Down arrow -->
    <path d="M200,160 L200,170" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Tier 3: TLD Server -->
    <g transform="translate(20, 172)">
      <rect width="360" height="48" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">3. Top-Level Domain (TLD) Server (.id / .sch.id)</text>
      <text x="14" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Server pengelola domain nasional PANDI (.id). Mengarahkan ke:</text>
      <text x="14" y="44" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">Authoritative Server SMKN 1</text>
    </g>

    <!-- Down arrow -->
    <path d="M200,222 L200,232" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Tier 4: Authoritative Server -->
    <g transform="translate(20, 234)">
      <rect width="360" height="52" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">4. Authoritative Nameserver (Pemegang Rekord Resmi)</text>
      <text x="14" y="32" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="9">Membaca DNS Zone File: Rekord A (Address Record)</text>
      <text x="14" y="46" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800">HASIL IP: 103.144.20.5 (Terkirim kembali ke Klien!)</text>
    </g>

    <!-- Diagnostic Commands Summary -->
    <g transform="translate(20, 298)">
      <rect width="360" height="66" rx="5" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Perintah Diagnostik DNS &amp; Konektivitas CLI:</text>
      <text x="14" y="34" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">• <tspan fill="#38bdf8">nslookup smkn1.sch.id</tspan> (Uji terjemah DNS)</text>
      <text x="14" y="48" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">• <tspan fill="#34d399">ping 103.144.20.5</tspan> (Uji waktu tempuh RTT)</text>
      <text x="14" y="60" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">• <tspan fill="#fbbf24">tracert smkn1.sch.id</tspan> (Lacak lompatan hop router)</text>
    </g>
  </g>
</svg>

