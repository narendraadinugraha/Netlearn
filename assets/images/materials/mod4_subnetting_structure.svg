<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>

  <rect width="880" height="480" rx="14" fill="url(#bgGrad4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(30, 26)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 04</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Struktur Pengalamatan IPv4 32-Bit &amp; Arsitektur Subnetting CIDR</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Visualisasi 4 Oktet Biner, Peminjaman Bit Subnet, dan Anatomi Blok Subnet (/24 ke /26).</text>
  </g>

  <!-- 32-bit Octet Breakdown -->
  <g transform="translate(30, 80)">
    <rect width="820" height="135" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CONTOH IP: 192.168.10.65 / 26</text>

    <!-- 4 Octet Boxes -->
    <!-- Oktet 1 -->
    <g transform="translate(20, 36)">
      <rect width="180" height="74" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">192</text>
      <text x="90" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">11000000</text>
      <rect x="45" y="50" width="90" height="16" rx="3" fill="#0284c7"/>
      <text x="90" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">OKTET 1 (8 bit)</text>
    </g>
    <!-- Dot -->
    <circle cx="210" cy="73" r="3" fill="#64748b"/>

    <!-- Oktet 2 -->
    <g transform="translate(220, 36)">
      <rect width="180" height="74" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">168</text>
      <text x="90" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">10101000</text>
      <rect x="45" y="50" width="90" height="16" rx="3" fill="#0284c7"/>
      <text x="90" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">OKTET 2 (8 bit)</text>
    </g>
    <!-- Dot -->
    <circle cx="410" cy="73" r="3" fill="#64748b"/>

    <!-- Oktet 3 -->
    <g transform="translate(420, 36)">
      <rect width="180" height="74" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
      <text x="90" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">10</text>
      <text x="90" y="40" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">00001010</text>
      <rect x="45" y="50" width="90" height="16" rx="3" fill="#0284c7"/>
      <text x="90" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">OKTET 3 (8 bit)</text>
    </g>
    <!-- Dot -->
    <circle cx="610" cy="73" r="3" fill="#64748b"/>

    <!-- Oktet 4 (Split Network & Host) -->
    <g transform="translate(620, 36)">
      <rect width="180" height="74" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="90" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" text-anchor="middle">65</text>
      <g font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
        <text x="35" y="40" fill="#38bdf8">01</text>
        <text x="50" y="40" fill="#64748b">|</text>
        <text x="60" y="40" fill="#f59e0b">000001</text>
      </g>
      <rect x="20" y="50" width="60" height="16" rx="2" fill="#0284c7"/>
      <text x="50" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">Subnet (2b)</text>
      <rect x="90" y="50" width="70" height="16" rx="2" fill="#d97706"/>
      <text x="125" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">Host ID (6b)</text>
    </g>
  </g>

  <!-- Lower Section: Subnet Allocation & Golden Rules -->
  <!-- Left Box: Subnet Block Breakdown -->
  <g transform="translate(30, 230)">
    <rect width="460" height="230" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="26" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">HASIL PEMBAGIAN SUBNET /26 (BLOCK SIZE = 64)</text>

    <!-- Subnet Row 1 -->
    <g transform="translate(20, 42)">
      <rect width="420" height="38" rx="4" fill="#1e293b"/>
      <text x="12" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Subnet 1:</text>
      <text x="12" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Net: 192.168.10.0</text>
      <text x="150" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Host: .1 s.d .62 (62 PC)</text>
      <text x="320" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Bc: .63</text>
    </g>

    <!-- Subnet Row 2 (Active/Target) -->
    <g transform="translate(20, 86)">
      <rect width="420" height="38" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Subnet 2 (Aktif):</text>
      <text x="12" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Net: 192.168.10.64</text>
      <text x="150" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Host: .65 s.d .126</text>
      <text x="320" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Bc: .127</text>
    </g>

    <!-- Subnet Row 3 -->
    <g transform="translate(20, 130)">
      <rect width="420" height="38" rx="4" fill="#1e293b"/>
      <text x="12" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Subnet 3:</text>
      <text x="12" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Net: 192.168.10.128</text>
      <text x="150" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Host: .129 s.d .190 (62 PC)</text>
      <text x="320" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Bc: .191</text>
    </g>

    <!-- Subnet Row 4 -->
    <g transform="translate(20, 174)">
      <rect width="420" height="38" rx="4" fill="#1e293b"/>
      <text x="12" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Subnet 4:</text>
      <text x="12" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Net: 192.168.10.192</text>
      <text x="150" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Host: .193 s.d .254 (62 PC)</text>
      <text x="320" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Bc: .255</text>
    </g>
  </g>

  <!-- Right Box: Golden Formulas -->
  <g transform="translate(505, 230)">
    <rect width="345" height="230" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="20" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RUMUS EMAS SUBNETTING CIDR</text>

    <g transform="translate(20, 42)" font-family="'Inter', sans-serif" font-size="11">
      <!-- Formula 1 -->
      <rect width="305" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Jumlah Subnet = 2^s</text>
      <text x="12" y="34" fill="#94a3b8" font-size="10">s = jumlah bit 1 yang dipinjam. (Contoh /26: 2^2 = 4 Subnet)</text>
    </g>

    <g transform="translate(20, 98)" font-family="'Inter', sans-serif" font-size="11">
      <!-- Formula 2 -->
      <rect width="305" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Host Valid = 2^h - 2</text>
      <text x="12" y="34" fill="#94a3b8" font-size="10">h = bit 0 host. Dikurangi 2 karena:</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="9">• 1st: Network ID | Last: Broadcast ID</text>
    </g>

    <g transform="translate(20, 164)" font-family="'Inter', sans-serif" font-size="11">
      <!-- Formula 3 -->
      <rect width="305" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Ukuran Blok = 256 - Mask</text>
      <text x="12" y="34" fill="#94a3b8" font-size="10">Contoh /26 mask 192 → 256 - 192 = 64 per blok.</text>
    </g>
  </g>
</svg>

