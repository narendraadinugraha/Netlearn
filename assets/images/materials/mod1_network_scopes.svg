<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="lanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="manGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="440" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="100" height="22" rx="5" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="50" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MODUL 01</text>
    <text x="112" y="16" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Klasifikasi Jangkauan Jaringan Komputer (PAN, LAN, MAN, WAN)</text>
    <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Perbandingan radius jangkauan, media transmisi fisik, throughput, dan latensi operasional.</text>
  </g>

  <!-- 4 Cards Grid -->
  <!-- Card 1: PAN -->
  <g transform="translate(30, 80)">
    <rect width="180" height="325" rx="10" fill="url(#panGrad)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <text x="31" y="36" fill="#34d399" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">📱</text>
    <text x="58" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">PAN</text>
    <text x="58" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Personal Area</text>
    
    <!-- Illustration -->
    <circle cx="90" cy="100" r="28" fill="#0f172a" stroke="#10b981" stroke-dasharray="3,3" stroke-width="1.5"/>
    <circle cx="90" cy="100" r="12" fill="#10b981" fill-opacity="0.3"/>
    <text x="90" y="104" fill="#6ee7b7" font-size="11" text-anchor="middle" font-family="'Inter', sans-serif">⌚</text>
    <circle cx="68" cy="85" r="7" fill="#10b981" fill-opacity="0.4"/>
    <circle cx="112" cy="115" r="7" fill="#10b981" fill-opacity="0.4"/>
    <line x1="90" y1="100" x2="68" y2="85" stroke="#34d399" stroke-width="1"/>
    <line x1="90" y1="100" x2="112" y2="115" stroke="#34d399" stroke-width="1"/>

    <!-- Specs List -->
    <g transform="translate(14, 150)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="0" fill="#cbd5e1" font-weight="700">Jangkauan:</text>
      <text x="0" y="14" fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="700">&lt; 10 Meter</text>
      
      <text x="0" y="35" fill="#cbd5e1" font-weight="700">Teknologi Utama:</text>
      <text x="0" y="49" fill="#94a3b8">Bluetooth, BLE, Zigbee, UWB, USB</text>
      
      <text x="0" y="70" fill="#cbd5e1" font-weight="700">Kecepatan:</text>
      <text x="0" y="84" fill="#94a3b8">1 - 24 Mbps</text>
      
      <text x="0" y="105" fill="#cbd5e1" font-weight="700">Latensi:</text>
      <text x="0" y="119" fill="#94a3b8">&lt; 1 ms (Sangat Rendah)</text>

      <text x="0" y="140" fill="#cbd5e1" font-weight="700">Contoh Kasus:</text>
      <text x="0" y="154" fill="#94a3b8">Smartwatch ke Smartphone, TWS Earbuds</text>
    </g>
  </g>

  <!-- Card 2: LAN -->
  <g transform="translate(225, 80)">
    <rect width="180" height="325" rx="10" fill="url(#lanGrad)" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.2"/>
    <text x="31" y="36" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏫</text>
    <text x="58" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">LAN</text>
    <text x="58" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Local Area</text>
    
    <!-- Illustration -->
    <rect x="68" y="85" width="44" height="16" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="90" y="96" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">SWITCH</text>
    <circle cx="50" cy="120" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="90" cy="125" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="130" cy="120" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <line x1="75" y1="101" x2="50" y2="113" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="90" y1="101" x2="90" y2="118" stroke="#0284c7" stroke-width="1.2"/>
    <line x1="105" y1="101" x2="130" y2="113" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Specs List -->
    <g transform="translate(14, 150)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="0" fill="#cbd5e1" font-weight="700">Jangkauan:</text>
      <text x="0" y="14" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700">100 m - 1 km</text>
      
      <text x="0" y="35" fill="#cbd5e1" font-weight="700">Teknologi Utama:</text>
      <text x="0" y="49" fill="#94a3b8">Ethernet Cat6, Switch, Wi-Fi 6 (ax)</text>
      
      <text x="0" y="70" fill="#cbd5e1" font-weight="700">Kecepatan:</text>
      <text x="0" y="84" fill="#94a3b8">100 Mbps - 10 Gbps</text>
      
      <text x="0" y="105" fill="#cbd5e1" font-weight="700">Latensi:</text>
      <text x="0" y="119" fill="#94a3b8">&lt; 2 ms (Sangat Cepat)</text>

      <text x="0" y="140" fill="#cbd5e1" font-weight="700">Contoh Kasus:</text>
      <text x="0" y="154" fill="#94a3b8">Lab Komputer TKJ, Gedung Kantor</text>
    </g>
  </g>

  <!-- Card 3: MAN -->
  <g transform="translate(420, 80)">
    <rect width="180" height="325" rx="10" fill="url(#manGrad)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="31" y="36" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🏙️</text>
    <text x="58" y="28" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">MAN</text>
    <text x="58" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Metropolitan Area</text>
    
    <!-- Illustration -->
    <ellipse cx="90" cy="102" rx="38" ry="18" fill="none" stroke="#8b5cf6" stroke-dasharray="4,3" stroke-width="1.5"/>
    <rect x="42" y="94" width="16" height="16" rx="2" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <text x="50" y="106" fill="#c4b5fd" font-size="9" text-anchor="middle">🏥</text>
    <rect x="122" y="94" width="16" height="16" rx="2" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <text x="130" y="106" fill="#c4b5fd" font-size="9" text-anchor="middle">🏦</text>
    <rect x="82" y="78" width="16" height="16" rx="2" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <text x="90" y="90" fill="#c4b5fd" font-size="9" text-anchor="middle">🏢</text>

    <!-- Specs List -->
    <g transform="translate(14, 150)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="0" fill="#cbd5e1" font-weight="700">Jangkauan:</text>
      <text x="0" y="14" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-weight="700">5 - 50 Kilometer</text>
      
      <text x="0" y="35" fill="#cbd5e1" font-weight="700">Teknologi Utama:</text>
      <text x="0" y="49" fill="#94a3b8">Dark Fiber, Metro Ethernet, Wireless PtP</text>
      
      <text x="0" y="70" fill="#cbd5e1" font-weight="700">Kecepatan:</text>
      <text x="0" y="84" fill="#94a3b8">100 Mbps - 10 Gbps</text>
      
      <text x="0" y="105" fill="#cbd5e1" font-weight="700">Latensi:</text>
      <text x="0" y="119" fill="#94a3b8">5 - 20 ms</text>

      <text x="0" y="140" fill="#cbd5e1" font-weight="700">Contoh Kasus:</text>
      <text x="0" y="154" fill="#94a3b8">Koneksi Antar Kampus / Bank 1 Kota</text>
    </g>
  </g>

  <!-- Card 4: WAN -->
  <g transform="translate(615, 80)">
    <rect width="195" height="325" rx="10" fill="url(#wanGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="31" y="36" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">🌍</text>
    <text x="58" y="28" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800">WAN</text>
    <text x="58" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Wide Area (Global)</text>
    
    <!-- Illustration -->
    <circle cx="97" cy="102" r="24" fill="#1e1804" stroke="#f59e0b" stroke-width="1.2"/>
    <ellipse cx="97" cy="102" rx="24" ry="10" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1"/>
    <ellipse cx="97" cy="102" rx="10" ry="24" fill="none" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="58" cy="85" r="4" fill="#fbbf24"/>
    <circle cx="136" cy="118" r="4" fill="#fbbf24"/>
    <path d="M58,85 Q97,60 136,118" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Specs List -->
    <g transform="translate(14, 150)" font-family="'Inter', sans-serif" font-size="10">
      <text x="0" y="0" fill="#cbd5e1" font-weight="700">Jangkauan:</text>
      <text x="0" y="14" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-weight="700">&gt; 100 km (Global)</text>
      
      <text x="0" y="35" fill="#cbd5e1" font-weight="700">Teknologi Utama:</text>
      <text x="0" y="49" fill="#94a3b8">Kabel Laut Bawah Air, Satelit, SD-WAN</text>
      
      <text x="0" y="70" fill="#cbd5e1" font-weight="700">Kecepatan:</text>
      <text x="0" y="84" fill="#94a3b8">10 Mbps - 100+ Gbps</text>
      
      <text x="0" y="105" fill="#cbd5e1" font-weight="700">Latensi:</text>
      <text x="0" y="119" fill="#94a3b8">30 - 300 ms (Jarak Jauh)</text>

      <text x="0" y="140" fill="#cbd5e1" font-weight="700">Contoh Kasus:</text>
      <text x="0" y="154" fill="#94a3b8">Jaringan Internet Dunia, Antar-Benua</text>
    </g>
  </g>
</svg>

