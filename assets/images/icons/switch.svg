<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- 1U Rack Chassis -->
  <rect x="4" y="20" width="56" height="24" rx="4" fill="url(#swGrad)" stroke="#075985" stroke-width="2"/>
  <rect x="7" y="24" width="50" height="16" rx="2" fill="#0f172a"/>
  <!-- 6 RJ45 Ethernet Ports -->
  <g fill="#334155" stroke="#64748b" stroke-width="0.5">
    <rect x="10" y="26" width="4" height="5" rx="0.5"/>
    <rect x="16" y="26" width="4" height="5" rx="0.5"/>
    <rect x="22" y="26" width="4" height="5" rx="0.5"/>
    <rect x="28" y="26" width="4" height="5" rx="0.5"/>
    <rect x="34" y="26" width="4" height="5" rx="0.5"/>
    <rect x="40" y="26" width="4" height="5" rx="0.5"/>
  </g>
  <!-- Port Activity Green LEDs -->
  <circle cx="12" cy="34" r="1.2" fill="#22c55e"/>
  <circle cx="18" cy="34" r="1.2" fill="#22c55e"/>
  <circle cx="24" cy="34" r="1.2" fill="#f59e0b"/>
  <circle cx="30" cy="34" r="1.2" fill="#22c55e"/>
  <circle cx="36" cy="34" r="1.2" fill="#22c55e"/>
  <circle cx="42" cy="34" r="1.2" fill="#22c55e"/>
  <!-- SFP Uplink Ports -->
  <rect x="47" y="26" width="7" height="12" rx="1" fill="#475569" stroke="#94a3b8" stroke-width="0.8"/>
  <circle cx="50.5" cy="32" r="1.5" fill="#38bdf8"/>
</svg>